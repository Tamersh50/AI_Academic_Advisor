<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المرشد الذكي — كلية الأعمال، جامعة الجوف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E1726;
  --ink-soft:#6B6076;
  --ink-faint:#9C93A6;
  --primary:#6A3B8B;
  --primary-deep:#4A2862;
  --primary-dd:#2E1840;
  --primary-light:#80519F;
  --primary-tint:#F1EAF6;
  --primary-line:#DECFE9;
  --gold:#D7B941;
  --gold-deep:#B39A2E;
  --gold-soft:#FBF2DC;
  --sand:#F7F5F9;
  --paper:#FFFFFF;
  --line:#E6E1EB;
  --ok:#1E7F5C;
  --warn:#B37A00;
  --danger:#B3392B;
  --r:14px;
  --r-s:9px;
  --shadow:0 1px 2px rgba(30,23,38,.06), 0 8px 24px rgba(30,23,38,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
  background:var(--sand);
  color:var(--ink);
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

/* ===== الهيكل ===== */
.shell{max-width:1080px;margin:0 auto;padding:0 16px 60px}

.topbar{
  background:linear-gradient(135deg,var(--primary-dd) 0%,var(--primary-deep) 45%,var(--primary) 100%);
  color:#fff;position:relative;overflow:hidden;
}
.topbar::after{
  content:"";position:absolute;inset:auto 0 0 0;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.topbar-in{max-width:1080px;margin:0 auto;padding:18px 16px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crest{height:40px;width:auto;flex:0 0 auto;display:block}
.crest-sep{width:1px;height:34px;background:rgba(255,255,255,.24);flex:0 0 1px}
.brand h1{font-size:21px;font-weight:800;letter-spacing:-.2px}
.brand p{font-size:12.5px;opacity:.82;font-weight:300}
.ver{
  margin-inline-start:auto;font-size:11.5px;letter-spacing:.5px;
  border:1px solid rgba(255,255,255,.28);padding:4px 10px;border-radius:999px;opacity:.9
}

.tabs{display:flex;gap:2px;max-width:1080px;margin:0 auto;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:11px 15px;font-size:14px;font-weight:500;color:rgba(255,255,255,.72);
  border-bottom:3px solid transparent;white-space:nowrap;transition:.18s
}
.tab:hover{color:#fff}
.tab.on{color:#fff;font-weight:700;border-bottom-color:var(--gold)}

.page{display:none;padding-top:22px}
.page.on{display:block;animation:rise .28s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}

/* ===== المحادثة ===== */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:460px}
.stream{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px;position:relative;scroll-behavior:smooth}
.msg{max-width:88%;display:flex;flex-direction:column;gap:6px}
.msg.me{align-self:flex-start}
.msg.bot{align-self:flex-end;max-width:94%}
.bubble{padding:12px 15px;border-radius:var(--r);font-size:15px}
.me .bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.bot .bubble{background:var(--primary-tint);border:1px solid var(--line);border-bottom-left-radius:4px}
.bot .bubble p+p{margin-top:9px}

/* البطاقة المرجعية — العنصر المميّز */
.refs{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.ref{
  background:var(--paper);border:1px solid var(--line);border-inline-start:3px solid var(--gold);
  border-radius:10px;padding:11px 13px;
}
.ref-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.ref-art{font-weight:700;font-size:13px;color:var(--primary-deep)}
.ref-src{font-size:11.5px;color:var(--ink-soft)}
.ref-text{font-family:'Amiri',serif;font-size:15.5px;line-height:1.95;color:#2E2437}
.stamp{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.2px}
.stamp.approved{background:#E7F3EE;color:var(--ok)}
.stamp.draft{background:var(--gold-soft);color:var(--warn)}

.rate{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-soft);margin-top:4px}
.rate button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 11px;font-size:12px;transition:.15s}
.rate button:hover{border-color:var(--primary);color:var(--primary)}
.rate button.picked{background:var(--primary);color:#fff;border-color:var(--primary)}

.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 12px}
.chip{
  border:1px solid var(--line);background:var(--paper);border-radius:999px;
  padding:6px 13px;font-size:13px;color:var(--ink-soft);transition:.15s
}
.chip:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-tint)}

.composer{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;align-items:flex-end;background:var(--paper);border-radius:0 0 var(--r) var(--r)}
.composer textarea{
  flex:1;border:1px solid var(--line);border-radius:var(--r-s);padding:11px 14px;
  resize:none;max-height:130px;font-size:15px;background:var(--sand)
}
.composer textarea:focus{outline:2px solid var(--primary);outline-offset:1px;background:var(--paper)}
.send{background:var(--primary);color:#fff;border-radius:var(--r-s);padding:11px 20px;font-weight:700;transition:.15s}
.send:hover{background:var(--primary-deep)}
.send:disabled{opacity:.45;cursor:not-allowed}

.typing{display:flex;gap:4px;padding:12px 15px}
.typing i{width:7px;height:7px;background:var(--primary);border-radius:50%;opacity:.4;animation:blink 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.notice{
  background:var(--gold-soft);border:1px solid #EBD9A6;color:#6B4B08;
  border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:16px
}
.disclaimer{text-align:center;font-size:11.5px;color:var(--ink-soft);padding:12px 8px 0}

/* ===== نماذج ===== */
label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-soft);margin-bottom:5px}
.fld{margin-bottom:14px}
input[type=text],input[type=password],select,textarea.f{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--sand);font-size:14.5px
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px;background:var(--paper)}
textarea.f{resize:vertical;min-height:110px;line-height:1.85}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn{background:var(--primary);color:#fff;border-radius:var(--r-s);padding:9px 18px;font-weight:700;font-size:14px;transition:.15s}
.btn:hover{background:var(--primary-deep)}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--primary-tint)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid #EBD3D6}
.btn.danger:hover{background:#FCF2F3}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

h2.sec{font-size:17px;font-weight:800;margin-bottom:4px}
p.sub{font-size:13px;color:var(--ink-soft);margin-bottom:16px}
.hint{font-size:12px;color:var(--ink-soft);margin-top:5px}

/* ===== قاعدة المعرفة ===== */
.kb-item{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;background:var(--paper)}
.kb-item h4{font-size:14.5px;font-weight:700;margin-bottom:3px}
.kb-meta{font-size:11.5px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
.kb-body{font-family:'Amiri',serif;font-size:15px;line-height:1.9;color:#3A2F44;max-height:78px;overflow:hidden;position:relative}
.kb-body.open{max-height:none}
.kb-acts{display:flex;gap:8px;margin-top:9px}
.kb-acts button{font-size:12px;color:var(--ink-soft);border:1px solid var(--line);border-radius:8px;padding:3px 11px}
.kb-acts button:hover{color:var(--primary);border-color:var(--primary)}

/* ===== التحليلات ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:15px}
.stat b{display:block;font-size:27px;font-weight:800;color:var(--primary);line-height:1.2}
.stat span{font-size:12px;color:var(--ink-soft)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--ink-soft);font-weight:500}

.syncbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--primary-tint);border:1px solid var(--primary-line);
  border-radius:var(--r);padding:11px 14px;margin-bottom:14px;font-size:13.5px}
.syncbar b{color:var(--primary-deep)}
.syncbar .pill{margin-inline-start:auto;font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px}
.syncbar .pill.same{background:#E4F3ED;color:var(--ok)}
.syncbar .pill.diff{background:var(--gold-soft);color:var(--warn)}
.syncact{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.syncact.primary{border-color:var(--primary-line);background:#FCFBFD}
.syncact h4{font-size:14.5px;font-weight:700;margin-bottom:3px}
.syncact .dir{font-family:monospace;font-size:12px;color:var(--ink-soft);letter-spacing:.3px}
.syncact p{font-size:12.5px;color:var(--ink-soft);margin:6px 0 11px;line-height:1.7}
.lock{max-width:340px;margin:40px auto;text-align:center}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;
  transition:.3s;z-index:99;opacity:0
}
.toast.show{transform:translateX(-50%);opacity:1}

@media(max-width:640px){
  .grid2{grid-template-columns:1fr}
  .chatwrap{height:calc(100vh - 200px)}
  .msg{max-width:96%}
  .brand h1{font-size:18px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* شاشة كاملة ثابتة، والمحادثة في بطاقة متمركزة على الشاشات الكبيرة */
html,body{height:100%;overflow:hidden}
.wrap{display:flex;flex-direction:column;height:100dvh}
.topbar{flex:0 0 auto}
.chatwrap{flex:1 1 auto;min-height:0;
  width:100%;max-width:860px;margin:0 auto;
  border:1px solid var(--line);border-top:none;
  border-radius:0 0 var(--r) var(--r);box-shadow:var(--shadow);background:var(--paper)}
.stream{flex:1 1 auto;min-height:0}
.chips{flex:0 0 auto}
.composer{flex:0 0 auto;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.disclaimer{flex:0 0 auto;padding:8px 12px}
@media(max-width:640px){
  .chatwrap{max-width:100%;border:none;border-radius:0;box-shadow:none;background:var(--sand)}
  .chips{gap:6px;padding:8px 12px;max-height:96px;overflow-y:auto;
    border-top:1px solid var(--line);background:var(--paper)}
  .chip{font-size:12.5px;padding:5px 11px}
  .topbar-in{padding:12px 14px 11px}
  .brand h1{font-size:17px}
  .crest{height:34px}
  .msg{max-width:100%}
  .bubble{font-size:14.5px}
  .stream{padding:14px 12px;gap:12px}
}
</style>
</head>

/* الكلمات الشائعة — تمرّ على التطبيع نفسه حتى تُحذف فعلًا */
const STOP=new Set(['في','من','على','عن','إلى','ما','ماذا','هل','هو','هي','أن','إن','إذا','كيف','متى','أين','لماذا','التي','الذي','مع','أو','و','ثم','كم','لي','لدي','عندي','يمكن','يمكنني','أستطيع','يجوز','ماهي','ماهو','بعد','قبل','هذا','هذه','ذلك','كل','أي','عندما','حتى','بين','لكن','عليّ','لو','قد','الطالب','طالب','أنا','عندهم','فيه','به','له'].map(w=>norm(w)));

const SYN={};
[['gpa','معدل تراكمي'],['جي بي ايه','معدل تراكمي'],['انذار','انذار تحذير'],['رسوب','رسب راسب اعادة'],
 ['طرد','فصل'],['انسحاب','اعتذار حذف'],['تجميد','تاجيل ايقاف'],['ساعات','وحدات عبء'],
 ['بريكوست','متطلب سابق'],['متطلب','متطلب سابق'],['سكشن','شعبة مقرر'],['دكتور','عضو هيئة تدريس'],
 ['ديجري','تقدير درجة'],['تخصص','قسم تحويل'],['ابغى','اريد'],['ودي','اريد'],['ايش','ما'],['وش','ما']
].forEach(([k,v])=>SYN[norm(k)]=norm(v));

/* إزالة أدوات التعريف والعطف من أول الكلمة */
function lite(w){ return w.replace(/^(وال|بال|فال|كال|لل|ال)/,''); }
/* هيكل جذري تقريبي: حذف حروف المدّ يقرّب "أُنذر" من "الإنذار" */
function skel(w){ return lite(w).replace(/[اوي]/g,''); }

function tokens(s){
  const out=[];
  norm(s).split(' ').forEach(w=>{ if(SYN[w]) out.push(...SYN[w].split(' ')); out.push(w); });
  return out.map(lite).filter(w=>w.length>1 && !STOP.has(w) && !STOP.has(lite(w)));
}
function fieldTokens(txt){ return norm(txt).split(' ').map(lite).filter(w=>w.length>1 && !STOP.has(w)); }

/* درجة تطابق كلمة واحدة مع قائمة كلمات: ١ تطابق تام ← ٠ لا تطابق */
function tokMatch(q,list){
  const qs=skel(q); let best=0;
  for(const t of list){
    if(t===q) return 1;
    if(q.length>=4 && (t.startsWith(q)||q.startsWith(t))) best=Math.max(best,.9);
    if(qs.length>=3){
      const ts=skel(t);
      if(ts.length<3) continue;              /* هيكل قصير أو فارغ لا يطابق شيئًا */
      if(ts===qs) best=Math.max(best,.85);
      else if(ts.startsWith(qs)||qs.startsWith(ts)) best=Math.max(best,.7);
      else if(ts.slice(1)===qs||qs.slice(1)===ts) best=Math.max(best,.6);
      else{                                   /* بادئة مشتركة: رسبت ↔ رسب */
        let c=0; while(c<ts.length&&c<qs.length&&ts[c]===qs[c]) c++;
        if(c>=3) best=Math.max(best,.6);
      }
    }
  }
  return best;
}

function retrieve(query,n=4){
  const qt=[...new Set(tokens(query))];
  if(!qt.length) return [];

  const idx=KB.map(e=>({e,
    T:fieldTokens(e.title), G:fieldTokens(e.tags||''),
    A:fieldTokens(e.article||''), B:fieldTokens(e.body)}));
  const N=idx.length||1;

  /* وزن الندرة: الكلمة المتكررة في كل المواد لا تميّز شيئًا */
  const df={};
  qt.forEach(w=>{ df[w]=idx.filter(o=>tokMatch(w,[...o.T,...o.G,...o.B])>0).length; });

  const scored=idx.map(o=>{
    let s=0,hit=0,best=0;
    qt.forEach(w=>{
      const m=Math.max(tokMatch(w,o.T)*6, tokMatch(w,o.G)*4.5, tokMatch(w,o.A)*2, tokMatch(w,o.B)*2.2);
      if(m>0){ hit++; best=Math.max(best,m); s+=m*Math.log(1+N/Math.max(1,df[w])); }
    });
    if(norm(query).length>8 && norm(o.e.body).includes(norm(query))) s+=10;
    if(o.e.status==='approved') s*=1.05;
    return {e:o.e, s, cov:hit/qt.length, best};
  });

  /* شرط القبول: تغطية كافية، أو مطابقة قوية في العنوان أو الكلمات المفتاحية */
  const need = qt.length<=2 ? 0.5 : 0.45;
  const ok=scored.filter(x=>x.s>0 && (x.cov>=need || x.best>=4)).sort((a,b)=>b.s-a.s);
  if(!ok.length) return [];
  const top=ok[0].s;
  return ok.filter(x=>x.s>=top*0.45).slice(0,n).map(x=>x.e);
}


/* ══════════════════ المحادثة ══════════════════ */
const stream=document.getElementById('stream');
function topOf(el){                       /* يضع بداية الرد أعلى الشاشة لا نهايته */
  requestAnimationFrame(()=>{
    const y=Math.max(0, el.offsetTop-14);
    const max=stream.scrollHeight-stream.clientHeight;
    stream.scrollTop=Math.min(y,max);
  });
}
function bubble(role,html){
  const d=document.createElement('div'); d.className='msg '+role;
  d.innerHTML='<div class="bubble">'+html+'</div>';
  stream.appendChild(d); stream.scrollTop=stream.scrollHeight; return d;
}
function greet(){
  bubble('bot','<p><b>أهلًا بك في المرشد الذكي.</b></p><p>أجيب عن أسئلتك الأكاديمية من واقع لوائح الجامعة وخططها الدراسية، وأذكر لك مصدر كل إجابة. اسألني عن الإنذار، الاعتذار، التحويل، المعدل، الحذف والإضافة، أو أي إجراء أكاديمي.</p>');
}

function bubble(role,html){
  const d=document.createElement('div'); d.className='msg '+role;
  d.innerHTML='<div class="bubble">'+html+'</div>';
  stream.appendChild(d); stream.scrollTop=stream.scrollHeight; return d;
}
const SUGGEST=["ما نسبة الغياب التي تحرمني من الاختبار؟", "كيف يُحسب المعدل التراكمي؟", "كيف أعتذر عن الفصل الدراسي؟", "ما شروط التحويل لتخصص آخر؟", "متى يكون الطالب راسبًا؟", "ما شروط مرتبة الشرف؟"];
function renderChips(){
  document.getElementById('chips').innerHTML =
    SUGGEST.map(s=>`<button class="chip" onclick="ask('${s}')">${s}</button>`).join('');
}
const qEl=document.getElementById('q'), sendEl=document.getElementById('send');
qEl.addEventListener('input',()=>{qEl.style.height='auto';qEl.style.height=Math.min(qEl.scrollHeight,130)+'px';});
qEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask();}});
sendEl.onclick=()=>ask();

const COURTESY=[
 [['غبي','غبيه','تافه','فاشل','زفت','ما تفهم','لا تفهم','ماتفهم','حمار','اخرس','حقير','ما ينفع','بلا فايده','ما تسوي شي','مالك فايده','سخيف','ركيك'],
  '<p>لعلّي لم أُفدك كما ينبغي.</p><p>أعد صياغة سؤالك بكلمات أخرى وسأحاول مجددًا. وإن كانت إجابة سابقة خاطئة فاضغط «غير دقيقة» أسفلها لتصل ملاحظتك إلى فريق العمل. أما ما يحتاج قرارًا بشريًا فمرجعه مرشدك الأكاديمي.</p>'],
 [['انت رائع','انت ممتاز','رائع','ممتاز','احسنت','ما شاء الله','ماشاء الله','جميل','حلو','عظيم','مبدع','شغل حلو','كفو','يسلمو'],
  '<p>شكرًا لك، هذا يسعدني.</p><p>وإن وجدت إجابة ناقصة فلا تتردد في الضغط على «غير دقيقة» — ملاحظاتك هي ما يحسّن النظام.</p>'],
 [['السلام عليكم','سلام عليكم'],'<p>وعليكم السلام ورحمة الله وبركاته، حيّاك الله.</p><p>اسألني عن أي إجراء أكاديمي: الإنذار، الاعتذار، التحويل، الغياب، المعدل، أو الحذف والإضافة.</p>'],
 [['حياك','حيالك','حياكم','يا هلا','هلا','مرحبا','اهلا','صباح الخير','مساء الخير','السلام','تحيه'],
  '<p>حيّاك الله وأهلًا بك.</p><p>تفضّل بسؤالك الأكاديمي، وسأجيبك من نص اللائحة مع ذكر رقم المادة.</p>'],
 [['اشكرك','شكرا','شكرًا','مشكور','يعطيك العافيه','جزاك الله','تسلم','ماقصرت','ما قصرت','الله يجزاك','ممنون'],
  '<p>لا شكر على واجب، ووفّقك الله في دراستك.</p><p>إن احتجت شيئًا آخر فأنا هنا.</p>'],
 [['مع السلامه','الله يحفظك','باي','وداعا','في امان الله','الي اللقاء','تصبح علي خير'],
  '<p>في أمان الله، ووفّقك الله.</p>'],
 [['من انت','مين انت','وش تسوي','ايش تسوي','وش تقدر','ماذا تفعل','وظيفتك','عرف بنفسك','ايش هذا','ما هذا','وش هذا','ما هو هذا'],
  '<p>أنا «المرشد الذكي»، مساعد إرشاد أكاديمي لطلاب كلية الأعمال بجامعة الجوف.</p><p>أجيب من نص لائحة الدراسة والاختبارات وقواعدها التنفيذية، وأذكر رقم المادة في كل إجابة. أما الحالات الفردية فمرجعها مرشدك الأكاديمي.</p>'],
 [['كيف الحال','كيفك','شخبارك','وش اخبارك','اخبارك','كيف حالك'],
  '<p>بخير والحمد لله، وأسأل الله أن تكون كذلك.</p><p>كيف أخدمك في أمورك الأكاديمية؟</p>']
];
const FILLER=new Set(['يا','الله','طيب','اخوي','استاذ','دكتور','ورحمه','وبركاته','جدا','والله','ابشر','خير','انت','انتم','هذا','كذا','مره','كثير','اوي']
  .map(w=>norm(w)));

/* تحية أم سؤال؟ نحذف عبارة المجاملة وننظر إلى ما تبقّى */
function smalltalk(t){
  const q=norm(t); if(q.length>80) return null;
  for(const [pats,reply] of COURTESY){
    const hit=pats.map(norm).find(pp=>q.includes(pp));
    if(!hit) continue;
    const restTxt=q.split(hit).join(' ');
    const rest=tokens(restTxt).filter(w=>!FILLER.has(w));
    /* ما تبقّى يُعدّ سؤالًا فقط إذا وُجد له نص في اللائحة */
    if(rest.length>=2 && retrieve(restTxt).length) return null;
    return reply;
  }
  return null;
}
function refsHTML(list){
  return '<div class="refs">'+list.map(e=>`
    <div class="ref">
      <div class="ref-head">
        <span class="ref-art">${esc(e.article||e.title)}</span>
        <span class="ref-src">${esc(e.source||'')}</span>
        <span class="stamp ${e.status==='approved'?'approved':'draft'}">${e.status==='approved'?'معتمد':'مسودة'}</span>
      </div>
      <div class="ref-text">${esc(e.body)}</div>
    </div>`).join('')+'</div>';
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}


/* ══════════════════ الاتصال بالخادم ══════════════════ */
async function srvPost(body){
  const r=await fetch(serverUrl(),{method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('رمز '+r.status);
  const j=await r.json(); if(!j.ok) throw new Error(j.error||'خطأ'); return j;
}

async function ask(preset){
  const text = preset || qEl.value.trim();
  if(!text) return;
  qEl.value=''; qEl.style.height='auto'; sendEl.disabled=true;
  bubble('me',esc(text));

  const greet = smalltalk(text);
  const hits  = greet? [] : retrieve(text);

  const wait=document.createElement('div');
  wait.className='msg bot';
  wait.innerHTML='<div class="bubble" style="padding:0"><div class="typing"><i></i><i></i><i></i></div></div>';
  stream.appendChild(wait); stream.scrollTop=stream.scrollHeight;

  let answer='', chat=false;
  if(greet){ answer=greet; chat=true; }
  else if(!hits.length){
    answer='<p>لا يتوفر لدي نص لائحي يجيب عن سؤالك.</p>'+
           '<p>أرجو مراجعة مرشدك الأكاديمي أو وحدة شؤون الطلاب بكلية الأعمال. سُجِّل سؤالك لإضافته إلى قاعدة المعرفة.</p>';
  } else {
    try{
      const j=await srvPost({action:'ask',q:text,
        sources:hits.map(e=>({article:e.article,source:e.source,title:e.title,body:e.body,status:e.status}))});
      answer='<p>'+esc(j.text).replace(/\n+/g,'</p><p>')+'</p>';
    }catch(err){
      answer='<p>تعذّر الوصول إلى خدمة الصياغة. إليك النصوص النظامية مباشرة:</p>';
    }
  }

  wait.remove();
  const d=bubble('bot',answer);
  if(hits.length) d.insertAdjacentHTML('beforeend', refsHTML(hits));

  if(!chat){
    const id='r'+Date.now();
    d.insertAdjacentHTML('beforeend',
      `<div class="rate" id="${id}"><span>هل أفادتك الإجابة؟</span>
       <button onclick="rate('${id}',1,${JSON.stringify(text).replace(/"/g,'&quot;')})">نعم</button>
       <button onclick="rate('${id}',0,${JSON.stringify(text).replace(/"/g,'&quot;')})">غير دقيقة</button></div>`);
  }
  topOf(d);

  srvPost({action:'log',q:text,found:chat?-1:hits.length,kind:chat?'chat':'q',
           articles:hits.map(x=>x.article).join(' | '),
           answer:d.querySelector('.bubble')?.innerText||''}).catch(()=>{});
  sendEl.disabled=false; qEl.focus();
}

function rate(id,val,q){
  const box=document.getElementById(id);
  box.querySelectorAll('button').forEach(b=>b.classList.remove('picked'));
  box.querySelectorAll('button')[val?0:1].classList.add('picked');
  srvPost({action:'log',q:q,found:'',kind:'q',rate:val}).catch(()=>{});
  toast(val?'شكرًا لك':'سُجِّلت الملاحظة لمراجعة الفريق');
}

/* ══════════════════ الإقلاع ══════════════════ */
/* صندوق إصلاح ذاتي — يظهر فقط حين يتعذّر الوصول للخادم */
function setupBox(why){
  qEl.disabled=sendEl.disabled=true;
  const d=bubble('bot','<p><b>تعذّر تحميل اللوائح.</b></p><p>'+esc(why||'')+'</p>');
  d.insertAdjacentHTML('beforeend',
    '<div class="ref" style="margin-top:10px">'+
    '<p style="font-size:12.5px;margin-bottom:8px">إن كنت مسؤول النظام، الصق رابط الخادم هنا (ينتهي بـ /exec):</p>'+
    '<input id="fixurl" type="text" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec" '+
    'style="width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;background:var(--sand)">'+
    '<div class="row" style="margin-top:9px">'+
    '<button class="btn" onclick="saveUrl()">حفظ وإعادة المحاولة</button>'+
    '<button class="btn ghost" onclick="clearUrl()">استعادة الرابط الأصلي</button></div></div>');
  const i=document.getElementById('fixurl'); if(i) i.value=serverUrl()||'';
}
function saveUrl(){
  const v=(document.getElementById('fixurl').value||'').trim().replace(/\/+$/,'');
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(v)){
    toast('الرابط غير صحيح — يجب أن ينتهي بـ /exec'); return; }
  try{ localStorage.setItem('murshid_server',v); }catch(e){}
  qEl.disabled=sendEl.disabled=false; boot();
}
function clearUrl(){ try{ localStorage.removeItem('murshid_server'); }catch(e){} boot(); }

async function boot(){
  stream.innerHTML=''; renderChips(); qEl.disabled=sendEl.disabled=false;
  const st=document.getElementById('kbstat');
  if(!serverUrl()){ st.textContent='غير مهيّأ'; setupBox('لم يُضبط رابط الخادم بعد.'); return; }
  let why='';
  try{
    const r=await fetch(serverUrl()+'?action=kb&_='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('استجابة الخادم: رمز '+r.status);
    let j; try{ j=await r.json(); }
    catch(e){ throw new Error('الرابط لا يعيد بيانات — تأكد أنه ينتهي بـ /exec وأن النشر مضبوط على Anyone'); }
    if(!j.ok) throw new Error(j.error||'رفض الخادم الطلب');
    if(!j.kb || !j.kb.length) throw new Error('EMPTY');
    KB=j.kb; cache('murshid_kb_cache',KB);
  }catch(e){
    why = e.message==='EMPTY'
      ? 'قاعدة المعرفة على الخادم فارغة. على مسؤول النظام رفعها من نسخة المشرف عبر زر «رفع القاعدة إلى الخادم».'
      : (e.message==='Failed to fetch'
          ? 'تعذّر الوصول إلى الخادم. تحقق من الإنترنت، ومن صحة الرابط، ومن أن النشر مضبوط على Anyone.'
          : e.message);
    KB=cache('murshid_kb_cache')||[];
  }
  st.textContent = KB.length? KB.length+' مادة نظامية' : 'غير متاح';
  if(!KB.length){
    setupBox(why); return;
  }
  if(why) toast('تُستخدم نسخة محفوظة — '+why.slice(0,60));
  bubble('bot','<p><b>أهلًا بك في المرشد الذكي.</b></p><p>أجيب عن أسئلتك الأكاديمية من واقع لوائح الجامعة وخططها الدراسية، وأذكر لك مصدر كل إجابة. اسألني عن الإنذار، الاعتذار، التحويل، المعدل، الحذف والإضافة، أو أي إجراء أكاديمي.</p>');
}
boot();
